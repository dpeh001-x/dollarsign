# Reverse proxy for the prediction app at predict.drdarylpeh.com
#
# Install:  sudo cp deploy/nginx-predict.conf /etc/nginx/sites-available/predict
#           sudo ln -s /etc/nginx/sites-available/predict /etc/nginx/sites-enabled/
#           sudo nginx -t && sudo systemctl reload nginx
#
# Then get HTTPS (certbot rewrites this file automatically):
#           sudo certbot --nginx -d predict.drdarylpeh.com

server {
    listen 80;
    server_name predict.drdarylpeh.com;

    location / {
        proxy_pass http://127.0.0.1:8501;
        proxy_http_version 1.1;

        # Streamlit runs over a WebSocket — these three lines are required
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 86400;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /_stcore/health {
        proxy_pass http://127.0.0.1:8501/_stcore/health;
    }
}
